name: POP MART 9216 stock monitor
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Read real pages without sending notifications'
        type: boolean
        default: true
      product_id:
        description: 'Validation reference (live mode always monitors 9216)'
        type: choice
        options: ['9216', '3317']
        default: '9216'
permissions:
  contents: write
concurrency:
  group: popmart-9216-inventory
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test stock-policy.test.mjs
      - run: npx playwright install chromium
      - run: node monitor.mjs
        env:
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only && 'true' || 'false' }}
          PRODUCT_ID: ${{ inputs.product_id || '9216' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch' || failure()
        with:
          name: stock-observation
          path: evidence/
          retention-days: 1




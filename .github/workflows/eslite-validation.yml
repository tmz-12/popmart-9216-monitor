name: Eslite cloud validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test eslite-policy.test.mjs eslite-notify.test.mjs stock-policy.test.mjs
      - run: npx playwright install chromium
      - run: node eslite-validate.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eslite-validation
          path: evidence/eslite/
          retention-days: 3
